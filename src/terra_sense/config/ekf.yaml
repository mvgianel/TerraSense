ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    pose0: /rtabmap/localization_pose
    pose0_config: [true,true,false,    
                      false,false,true,   
                      false,false,false,   
                      false,false,false]
    pose0_queue_size: 10
    pose0_relative: false
    pose0_differential: false

    odom0: /odom
    odom0_config: [false,  false,  false,
                       false, false, false,
                       true, false, false,
                       false, false, false,]
    odom0_twist_rejection_theshold: 2.5
    odom0_pose_rejection_theshold: 2.5
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /rtabmap/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,]
    imu0_differential: true
    imu0_relative: false
    use_control: false

